# ACS Engenharia — site estático no homelab.
# Escuta só no próprio celular; o Cloudflare Tunnel encaminha o hostname público para cá.
# Não altera o bloco do primeiro sistema (porta 8080).

server {
    listen 127.0.0.1:8081;
    server_name _;

    root /opt/acs-site;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/acs-site.access.log;
    error_log  /var/log/nginx/acs-site.error.log warn;

    # Equivalente ao arquivo _headers usado no Netlify/Cloudflare Pages.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'" always;

    # Arquivos de manutenção do repositório não são públicos.
    location ~ ^/(deploy|tools|marca)(/|$) { return 404; }
    location ~ /\.            { return 404; }
    location = /_headers      { return 404; }
    location ~ \.md$          { return 404; }

    # A página muda a cada atualização: o navegador sempre confere se há versão nova.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'" always;
    }

    # Vídeos, fotos e ícones: cache longo (o vídeo do topo usa ?v= para forçar versão nova).
    location ~* \.(webm|mp4|jpg|jpeg|webp|png|svg|ico|json)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
